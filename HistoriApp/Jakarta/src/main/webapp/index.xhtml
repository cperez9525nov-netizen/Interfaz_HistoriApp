<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    template="/WEB-INF/templates/template.xhtml">

    <ui:define name="title">
        Mapas Históricos - HistoriApp
    </ui:define>
    

    <ui:define name="contenido">

        <!-- IMAGEN DE FONDO -->

<div class="imagen-fondo">
  <img src="#{request.contextPath}/img/grabadoIndex.jpg" alt="Imagen de grabado de la ciudad de Roma en época Imperial" />
</div>


<!-- MAIN (cuerpo de la página) -->

<main class="container-fluid my-5 py-3">
  <div class="row g-4">
    
    <!-- COLUMNA IZQUIERDA: Mapa Histórico -->
    <div class="col-lg-9">
      <div class="card bg-dark text-white border-secondary shadow overflow-hidden">

        <h:form id="formSiglo">
          <div class="card-header bg-dark border-secondary d-flex justify-content-center align-items-center py-3">
            <label for="select-siglo" class="h5 mb-0 text-warning me-3 fw-bold">SIGLO:</label>
          
            <h:selectOneMenu id="select-siglo" value="#{batallasBean.sigloSeleccionado}" styleClass="form-select bg-dark text-warning border-warning w-auto fw-bold">
              <f:selectItem itemValue="III a.C." itemLabel="III a.C." />
              <f:selectItem itemValue="II a.C." itemLabel="II a.C." />
              <f:selectItem itemValue="I a.C." itemLabel="I a.C." />
              <f:selectItem itemValue="I d.C." itemLabel="I d.C." />
              <f:selectItem itemValue="II d.C." itemLabel="II d.C." />
              <f:selectItem itemValue="III d.C." itemLabel="III d.C." />
              <f:selectItem itemValue="IV d.C." itemLabel="IV d.C." />
              
              <p:ajax event="change" update=":formAcordeon:acordeonBatallas :contenedorDatos" oncomplete="actualizarMapa()"/>   
            </h:selectOneMenu>           
          </div>
        </h:form>

        <!-- Mapa de Leaflet -->
        <div class="card-body p-0">
          <div id="map" style="height: 550px; width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- COLUMNA DERECHA: Menú de Batallas en Acordeón -->
<div class="col-lg-3">
  <div class="card bg-dark text-white border-secondary shadow">
    
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center gap-2">
    <h5 class="mb-0">Batallas Clave</h5>
    
    <!-- Icono de información con SVG en línea -->
    <span class="text-warning cursor-pointer" 
          title="Haz clic en una batalla para expandir su información" 
          data-bs-toggle="tooltip" 
          data-bs-placement="top">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-info-circle-fill" viewBox="0 0 16 16">
        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/>
      </svg>
    </span>
  </div>

  <span class="badge bg-danger">Cronología</span>
</div>

    <!-- Acordeón de PrimeFaces -->
     <h:form id="formAcordeon">
    <p:accordionPanel id="acordeonBatallas" value="#{batallasBean.batallasDelSigloSeleccionado}" var="batalla" dynamic="true" cache="true" activeIndex="-1" styleClass="custom-accordion">
        <p:tab>
            <!-- Cabecera personalizada de la pestaña para imitar el primer diseño que hice en el html original -->
            <f:facet name="title">
              <div class="d-flex justify-content-between align-items-center w-100 pe-3">
                <div class="me-auto pe-2 text-start">
                  <strong class="text-white">#{batalla.titulo}</strong>
                    <div class="small text-warning">#{batalla.subtitulo}</div>
                </div>
                <span class="badge bg-outline-light border text-warning me-2">#{batalla.anyo}</span>
              </div>
            </f:facet>

            <!-- Cuerpo de la pestaña -->
            <div class="small text-light">
                #{batalla.descripcion}
                <div class="mt-3 text-end">
                    <a href="#" class="btn btn-sm btn-burdeos">Saber más &#187;</a>
                </div>
            </div>
        </p:tab>
    </p:accordionPanel>
    </h:form>

  </div>
</div>

  </div>
</main>

      <!-- CONTENEDOR OCULTO PARA PASAR DATOS DE JAVA A JAVASCRIPT -->
        <h:panelGroup id="contenedorDatos" style="display:none;">
            <ui:repeat value="#{batallasBean.batallasDelSigloSeleccionado}" var="b">
                <div class="batalla-item"
                     data-titulo="#{b.titulo}"
                     data-subtitulo="#{b.subtitulo}"
                     data-lat="#{b.latitud}"
                     data-lng="#{b.longitud}"
                     data-desc="#{b.descripcion}"
                     data-anyo="#{b.anyo}">
                </div>
            </ui:repeat>
        </h:panelGroup>

<script>
//<![CDATA[
  var map = L.map('map').setView([41.9028, 12.4964], 5);

  L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
    maxZoom: 20,
    attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a>, &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="http://openstreetmap.org">OpenStreetMap</a> contributors'
  }).addTo(map);

  var marcadoresLayer = L.layerGroup().addTo(map);

  // Nuevo marcador personalizado: icono de las dos espadas
  var iconoEspadas = L.icon({
      iconUrl: '#{request.contextPath}/img/espadas-cruzadas.png',
      iconSize: [36, 36],     // Tamaño del icono en píxeles
      iconAnchor: [18, 18],   // El punto central del icono que se posiciona en las coordenadas
      popupAnchor: [0, -18]   // Dónde se abre el bocadillo de información respecto al icono
  });

  function actualizarMapa() {
      if (typeof marcadoresLayer !== 'undefined') {
          marcadoresLayer.clearLayers();
      }
      
      var elementos = document.querySelectorAll('#contenedorDatos .batalla-item');
      
      elementos.forEach(function(el) {
          var lat = parseFloat(el.getAttribute('data-lat'));
          var lng = parseFloat(el.getAttribute('data-lng'));
          
          var titulo = el.getAttribute('data-titulo') || '';
          var subtitulo = el.getAttribute('data-subtitulo') || '';
          var desc = el.getAttribute('data-desc') || '';
          var anyo = el.getAttribute('data-anyo') || '';

          // Ahora ya puedes usar el && de JavaScript normal y corriente sin que el XML sufra
          if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
              var marker = L.marker([lat, lng], { icon: iconoEspadas }).addTo(marcadoresLayer);
              
              var contenidoPopup = '<div style="color: #000; max-width: 200px;">' +
                  '<strong>' + titulo + ' (' + anyo + ')</strong><br/>' +
                  '<small style="color: #555;">' + subtitulo + '</small><hr style="margin: 4px 0;"/>' +
                  '<p style="font-size: 11px; margin: 0;">' + desc + '</p>' +
                  '</div>';
              
              marker.bindPopup(contenidoPopup);
          }
      });
  }

  document.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() { 
          if(map) {
              map.invalidateSize();
              actualizarMapa();
          }
      }, 500);
  });
//]]>
</script>

    </ui:define>

</ui:composition>
