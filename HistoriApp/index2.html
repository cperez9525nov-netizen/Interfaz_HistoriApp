<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="">
    <title>Prueba</title>
    <style>
        .col {
            padding: 20px;
            margin: 5px;
        }
        .row {
            background-color: beige;
        }
        .btn-outline-success {
            color: #ffc107 !important;              
            border-color: #ffc107 !important;
        }
        .btn-outline-success:hover {
            transform: scale(1.10);
            color: #ffffff !important;              
            background-color: #ffc107 !important;   
            border-color: #ffc107 !important;
        }
    </style>
</head>
<body>
    <header class="container-fluid">
        <div class="row">
            <div class="d-flex align-items-center flex-grow-1">
                <a class="navbar-brand me-3" href="#">HistoriApp</a>
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Biografías</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Enlaces externos</a>
                        </li>
                    </ul>
            </div>
            <!-- Buscador izquierdo -->
            <div class="d-flex justify-content-end flex-grow-1 mt-2 mt-lg-0 col">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Localiza tu batalla..." aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Buscar</button>
                </form>
            </div>
        </div>    
    </header>
</body>
</html>
