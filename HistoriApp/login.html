<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - HistoriApp</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style_login.css">
  
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center py-4">

  <main class="form-signin w-100 m-auto">
    <div class="card bg-dark text-white border-secondary p-4 shadow-lg">
      
      <!-- Logo / Título -->
      <div class="text-center mb-4">
        <h1 class="h2 text-warning fw-bold">HistoriApp</h1>
        <p class="text-muted small texto-aviso1">Elige cómo deseas acceder</p>
      </div>

      <!-- BOTONES DE REDES SOCIALES -->
      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-outline-light d-flex align-items-center justify-content-center gap-2 py-2" type="button">
          <i class="bi bi-google text-danger"></i>
          <span>Continuar con Google</span>
        </button>
        <button class="btn btn-outline-light d-flex align-items-center justify-content-center gap-2 py-2" type="button">
          <i class="bi bi-apple"></i>
          <span>Continuar con Apple</span>
        </button>
      </div>

      <!-- SEPARADOR -->
      <div class="divider-text text-muted small texto-aviso4">
        <span>o usa tu correo</span>
      </div>

      <!-- FORMULARIO DE ACCESO TRADICIONAL -->
      <form>
        <!-- Input Email -->
        <div class="form-floating mb-3">
          <input type="email" class="form-control bg-dark text-white border-secondary" id="floatingInput" placeholder="nombre@ejemplo.com" required>
          <label for="floatingInput" class="text-secondary">Correo electrónico</label>
        </div>

        <!-- Input Contraseña -->
        <div class="form-floating mb-3">
          <input type="password" class="form-control bg-dark text-white border-secondary" id="floatingPassword" placeholder="Contraseña" required>
          <label for="floatingPassword" class="text-secondary">Contraseña</label>
        </div>

        <!-- Recuérdame y ¿Olvidaste contraseña? -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
            <label class="form-check-label text-muted small texto-aviso2" for="flexCheckDefault">
              Recordarme
            </label>
          </div>
          <a href="#" class="text-warning small text-decoration-none">¿Olvidaste tu clave?</a>
        </div>

        <!-- Botón Iniciar Sesión -->
        <button class="btn btn-warning w-100 py-2 fw-bold mb-3" type="submit">
          Iniciar Sesión
        </button>
      </form>

      <!-- SEPARADOR PARA INVITADO -->
      <div class="divider-text text-muted small texto-aviso5">
        <span>¿Solo estás de visita?</span>
      </div>

      <!-- BOTÓN DE ENTRAR COMO INVITADO -->
      <a href="index.html" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-person-circle"></i>
        <span>Entrar como Invitado</span>
      </a>

      <!-- PIE CON ENLACE A REGISTRO -->
      <div class="text-center mt-4 pt-2 border-top border-secondary">
        <p class="text-muted small mb-0 texto-aviso6">
          ¿No tienes una cuenta? 
          <a href="#" class="text-warning fw-bold text-decoration-none ms-1">Regístrate gratis</a>
        </p>
      </div>

    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
